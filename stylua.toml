column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
# The codebase targets Lua 5.4 and testing/runAll.lua uses Lua 5.2 label
# syntax (::continue:: / goto); stylua's default Luau parser rejects it.
syntax = "Lua52"
